name: CI (GPU Self-Hosted)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch: {}

jobs:
  checks:
    runs-on: [self-hosted, gpu]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Python version
        run: python --version

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Install dev tools
        run: python -m pip install -r requirements-dev.txt

      - name: Syntax check
        run: python -m compileall .

      - name: Ruff (lint)
        run: ruff check .

      - name: Black (format check)
        run: black --check .

      - name: MyPy (type check)
        run: mypy .

      - name: Vulture (dead code scan)
        run: vulture . vulture-whitelist.py --min-confidence 80 --exclude .venv,.git,__pycache__ || true

      - name: Offline smoke test (imports only)
        run: python scripts/ci_smoke.py

      - name: CUDA required sanity
        run: |
          python - <<'PY'
          import torch
          print("torch:", torch.__version__)
          print("torch.version.cuda:", torch.version.cuda)
          assert torch.cuda.is_available(), "CUDA GPU required but not available on this runner"
          print("gpu:", torch.cuda.get_device_name(0))
          x = torch.randn(1024, 1024, device="cuda")
          y = x @ x
          print("CUDA matmul ok:", float(y.mean()))
          PY

      - name: Pytest
        run: pytest -q