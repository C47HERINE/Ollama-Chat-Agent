name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Install dev tools
        run: python -m pip install -r requirements-dev.txt

      - name: Syntax check
        run: python -m compileall .

      - name: Ruff (lint)
        run: ruff check .

      - name: Black (format check)
        run: black --check .

      - name: MyPy (type check)
        run: mypy .

      - name: Vulture (dead code scan)
        run: vulture . vulture-whitelist.py --min-confidence 80 || true

      - name: Offline smoke test (imports only)
        run: python scripts/ci_smoke.py

      - name: Pytest (optional)
        run: pytest -q